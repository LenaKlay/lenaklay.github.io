# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

title: Léna Kläy
description: Léna Kläy — Researcher
baseurl: ""
url: "https://lenaklay.github.io"
og_image: /assets/img/profile-pic.jpg

header:
  pages:
    - name: Home
      slug: /
    - name: Research
    - name: Teaching
    - name: Science communication
    - name: Miscellaneous

footer:
  show_powered_by: false
  contact:
    - type: email
      name: Email
      value: lena.klay@mnhn.fr
  follow:
    - type: orcid
      name: Orcid
      link: https://orcid.org/0009-0006-8335-186X
    - type: googlescholar
      name: Google Scholar
      link: https://scholar.google.com/citations?user=OiSGrGYAAAAJ&hl=fr&oi=ao
    - type: github
      name: GitHub
      link: http://github.com/LenaKlay
    

# Build settings
markdown: kramdown
sass:
    style: :compressed
plugins:
  - jekyll-feed

# Excluded items
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - feed.xml
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Used for defeating caching
version: 1
